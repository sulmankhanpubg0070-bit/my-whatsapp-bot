<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Messages Live Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    h2 {
      text-align: center;
      color: #075e54;
    }
    .msg-box {
      border-bottom: 1px solid #ddd;
      padding: 10px 0;
      display: flex;
      flex-direction: column;
    }
    .sender {
      font-weight: bold;
      color: #128c7e;
    }
    .sender.me {
      color: #34b7f1;
    }
    .text {
      margin-top: 5px;
      font-size: 16px;
    }
    .time {
      font-size: 11px;
      color: #888;
      align-self: flex-end;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>WhatsApp Live Message Logs</h2>
  <div id="messages-list">Loading messages...</div>
</div>

<script>
  async function fetchMessages() {
    try {
      const response = await fetch('/api/messages');
      const messages = await response.json();
      
      const container = document.getElementById('messages-list');
      if (messages.length === 0) {
        container.innerHTML = "<p>Koi message save nahi hua abhi tak.</p>";
        return;
      }

      container.innerHTML = messages.map(msg => `
        <div class="msg-box">
          <span class="sender ${msg.fromMe ? 'me' : ''}">${msg.sender}</span>
          <span class="text">${msg.message}</span>
          <span class="time">${new Date(msg.timestamp).toLocaleString()}</span>
        </div>
      `).join('');
    } catch (err) {
      console.error("Fetch error:", err);
    }
  }

  // Har 3 second baad auto refresh hoga dashboard
  fetchMessages();
  setInterval(fetchMessages, 3000);
</script>

</body>
</html>
